

x-spark: &spark
  image: exercice-livraisons/spark:3.5.7
  build: ./docker
  pull_policy: build                        

services:
  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./conf:/opt/spark/conf:ro

  spark-worker:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
             spark://spark-master:7077 --cores 2 --memory 3g
    depends_on: [spark-master]
    volumes:
      - ./conf:/opt/spark/conf:ro
      - ./data:/work/data:ro                 
      - ./resultats:/work/resultats          

  jupyter:                                   
    <<: *spark
    hostname: jupyter                        
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
             --ServerApp.token= --ServerApp.password= --ServerApp.root_dir=/work
    depends_on: [spark-master, mongo]
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./conf:/opt/spark/conf:ro
      - ./notebooks:/work/notebooks
      - ./data:/work/data:ro
      - ./resultats:/work/resultats
      - ./events:/work/events

  spark-history:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    ports:
      - "18080:18080"
    volumes:
      - ./conf:/opt/spark/conf:ro
      - ./events:/work/events:ro

  mongo:                                     
    image: mongo:7.0
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
