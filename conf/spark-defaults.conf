# Lu par tous les conteneurs (monté dans /opt/spark/conf).
spark.master                      spark://spark-master:7077
spark.driver.memory               3g
spark.executor.memory             2g
spark.sql.session.timeZone        Europe/Paris
# Historique des applications (Spark History, port 18080)
spark.eventLog.enabled            true
spark.eventLog.dir                file:/work/events
spark.history.fs.logDirectory     file:/work/events
